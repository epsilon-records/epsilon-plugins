# Netlify: serve the static site in site/ (no build step).
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/install"
  to = "/install.html"
  status = 200

[[redirects]]
  from = "/made"
  to = "/made.html"
  status = 200

# Each plugin has its own page: /<name> serves site/<name>.html (generated by
# scripts/generate-plugin-pages.mjs). Each uri in plugins.json (plugins.epsilonrecords.com/<name>) lands there.
# generated:plugins

